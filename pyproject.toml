[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privan-130m"
version = "0.1.0"
description = "A ~130M parameter decoder-only transformer language model built from scratch in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Priyan A", email = "priyan1436ei@gmail.com"}
]
dependencies = [
    "torch>=2.0.0",
    "tokenizers>=0.13.0",
    "safetensors>=0.3.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tqdm>=4.65.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
